[package]
name = "rayx_services_fonts"
description = "RayX's font service on NSH: the app's fonts registered with NSH from any thread and the aliases it names them by, for Rust and TSX."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rayx_app.workspace = true
rayx_app_nsh.workspace = true
nsh-core.workspace = true
futures = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
rayx_app_nsh = { workspace = true, features = ["testing"] }
nsh-core = { workspace = true, features = ["declarations"] }
nsh-engine = { workspace = true, features = ["js", "inspect"] }
crossbeam-channel.workspace = true
serde_json.workspace = true
