[package]
name = "rayx_app"
description = "RayX's dependency injection, options and app builder on NSH: a root provider per engine surface, a scope per screen and view models activated with their screen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures = { workspace = true, features = ["std"] }
serde_json.workspace = true
rayx_core.workspace = true
rayx_runtime.workspace = true
nsh-core.workspace = true
dxn_reactive.workspace = true

[dev-dependencies]
nsh-base.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
nsh-bundler.workspace = true
nsh-js.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
