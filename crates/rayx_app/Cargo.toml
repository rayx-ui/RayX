[package]
name = "rayx_app"
description = "RayX's dependency injection, options and app builder on NSH: a root provider per engine surface, a scope per screen and view models activated with their screen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
dxn_i18n_macros.workspace = true
dxn_intl.workspace = true
futures = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
rayx_core.workspace = true
rayx_devtools_protocol.workspace = true
rayx_runtime.workspace = true
url.workspace = true
nsh-core.workspace = true
dxn_reactive.workspace = true

# The dev tools' agent dials its hub with the WebSocket client NSH compiles, on a thread of its
# own (`src/devtools/link.rs`); only a dev build uses it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
# A screenshot cropped to a node (`src/devtools/act.rs`).
png = "0.17"

[dev-dependencies]
# The declarations' text (docs and TypeScript), which the TS test groups read.
nsh-core = { workspace = true, features = ["declarations"] }
nsh-base.workspace = true
nsh-engine = { workspace = true, features = ["js", "inspect"] }
nsh-bundler.workspace = true
nsh-js.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
tungstenite = "0.28"

# The messages `rayx_app::checked::tr!` checks this crate's tests against (an app keeps its own
# in `assets/locales/`, the default).
[package.metadata.dxn_i18n]
messages = "tests/fixtures/locales"
