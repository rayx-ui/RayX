[package]
name = "rayx_services_storage"
description = "RayX's key-value storage on NSH: the app's values in NSH's storage, persistent and reachable from any thread, or in memory, for Rust and TSX."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rayx_app.workspace = true
rayx_app_nsh.workspace = true
nsh-core.workspace = true
base64.workspace = true
futures = { workspace = true, features = ["std"] }
getrandom.workspace = true

# Entropy for the store's id in a browser: the page's Web Crypto. An NSH web build selects
# getrandom's custom backend (NSH's), which takes precedence.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
rayx_app_nsh = { workspace = true, features = ["testing"] }
nsh-core = { workspace = true, features = ["declarations"] }
nsh-engine = { workspace = true, features = ["js", "inspect"] }
crossbeam-channel.workspace = true
futures = { workspace = true, features = ["std", "executor"] }
serde = { workspace = true, features = ["derive"] }
