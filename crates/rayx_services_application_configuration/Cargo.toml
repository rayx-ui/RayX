[package]
name = "rayx_services_application_configuration"
description = "RayX's application configuration on NSH: the app's own settings (motion, scrolling, tooltips, notifications, layout direction) from configuration and code, following its reloads and the user's motion setting, for Rust and TSX."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rayx_app.workspace = true
rayx_app_nsh.workspace = true
nsh-core.workspace = true
futures = { workspace = true, features = ["std"] }
serde_json.workspace = true

[dev-dependencies]
rayx_app_nsh = { workspace = true, features = ["testing"] }
nsh-core = { workspace = true, features = ["declarations"] }
nsh-engine = { workspace = true, features = ["js", "inspect"] }
futures = { workspace = true, features = ["std", "executor"] }
