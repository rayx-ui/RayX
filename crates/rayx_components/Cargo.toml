[package]
name = "rayx_components"
description = "RayX's component library for NSH apps: the design system's roles, its default theme (an NSH theme document that maps them), and its components on nsh-base's behavior, for Rust and TSX."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nsh-core.workspace = true
nsh-base.workspace = true

# `build.rs` reads `roles.json`, RayX's role list, into `theme::roles`.
[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
nsh-core = { workspace = true, features = ["declarations"] }
nsh-engine = { workspace = true, features = ["js"] }
nsh-bundler.workspace = true
nsh-js.workspace = true
nsh-theme.workspace = true
oxc.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
