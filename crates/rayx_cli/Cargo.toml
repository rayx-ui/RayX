[package]
name = "rayx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The RayX command-line tool: machine setup, doctor, WSL and Lima guests, self update, and any Native Shell (NSH) app run through the nsh it pins."
license.workspace = true
repository.workspace = true
readme = "README.md"
publish.workspace = true

[lib]
name = "rayx_cli"
path = "src/lib.rs"

[[bin]]
name = "rayx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axoupdater = { version = "0.10.2", features = ["blocking"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
semver = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1", features = ["rt"] }
toml = "0.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Console"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[package.metadata.dist]
dist = true
