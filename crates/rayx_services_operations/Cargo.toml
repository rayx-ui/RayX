[package]
name = "rayx_services_operations"
description = "RayX's operation service: typed, serializable operations applied atomically by their targets' handlers, in transactions, published for history and peers, for Rust and TSX."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Keeps the latest committed operations and failure codes in the published state.
diagnostics = []

[dependencies]
rayx_app.workspace = true
rayx_app_nsh.workspace = true
nsh-core.workspace = true
futures = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
rayx_app_nsh = { workspace = true, features = ["testing"] }
nsh-core = { workspace = true, features = ["declarations"] }
nsh-engine = { workspace = true, features = ["js", "inspect"] }
crossbeam-channel.workspace = true
futures = { workspace = true, features = ["std", "executor"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
