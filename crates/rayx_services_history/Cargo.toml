[package]
name = "rayx_services_history"
description = "RayX's history: undo and redo per scope of the operations the app's operation service publishes, in memory or persisted in the app's key-value store, for Rust and TSX."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Keeps the replays that failed (their codes, and how many met a released target) in the
# published state.
diagnostics = []

[dependencies]
rayx_app.workspace = true
rayx_app_nsh.workspace = true
nsh-core.workspace = true
futures = { workspace = true, features = ["std"] }
getrandom.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# Entropy for entry ids in a browser: the page's Web Crypto. An NSH web build selects
# getrandom's custom backend (NSH's), which takes precedence.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
rayx_app_nsh = { workspace = true, features = ["testing"] }
rayx_services_storage.workspace = true
nsh-core = { workspace = true, features = ["declarations"] }
nsh-engine = { workspace = true, features = ["js", "inspect"] }
crossbeam-channel.workspace = true
futures = { workspace = true, features = ["std", "executor"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
