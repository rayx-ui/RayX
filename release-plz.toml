# release-plz: keeps a release pull request with the version bump and the CHANGELOG.md section
# open on `main`; merging it pushes the tag `vX.Y.Z`, which starts dist's Release workflow
# (`.github/workflows/release.yml`): dist, not release-plz, builds the `rayx` binaries and creates
# the GitHub Release whose notes are that section. See docs/releasing.md.
#
# 0.x policy: `fix`, `perf` and `feat` bump the patch (0.4.0 -> 0.4.1); a breaking change (`!`
# after the type or scope, or a `BREAKING CHANGE:` footer) bumps the minor (0.4.x -> 0.5.0). A
# breaking commit also carries a `Migration:` footer per consumer; the changelog prints them.

[workspace]
# Versions come from git tags; nothing goes to crates.io (`publish = false` in Cargo.toml too).
git_only = true
publish = false
git_tag_enable = true
git_tag_name = "v{{ version }}"
# dist creates the GitHub Release from the tag, with the binaries, installers and attestations.
git_release_enable = false
changelog_update = true
# Breaking changes are declared by their commits. cargo-semver-checks would also build NSH for
# both the tag and `main` on every run.
semver_check = false
# Only changes that reach users start a release; docs, tests, CI, build and agentx commits ride
# along in the next one.
release_commits = "^(feat|fix|perf)"

# One release unit: the crates inherit `[workspace.package] version`, `rayx_app` builds on
# `rayx_core` and `rayx_runtime`, the layers re-export `rayx_app_macros`' derive, the `rayx`
# umbrella re-exports them all and `rayx-cli` scaffolds apps on the same tag, so they share one
# version (the version group), one tag `vX.Y.Z`, one GitHub Release and one root CHANGELOG.md,
# all owned by `rayx_app`.
[[package]]
name = "rayx_app"
changelog_path = "./CHANGELOG.md"
changelog_include = ["rayx", "rayx_core", "rayx_runtime", "rayx_app_macros", "rayx-cli"]
version_group = "rayx"

[[package]]
name = "rayx_core"
version_group = "rayx"
# Released under `rayx_app`'s tag and changelog. It keeps the inherited `git_tag_name`: in
# git-only mode that template is how it finds its previous version (`v*` tags).
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "rayx_runtime"
version_group = "rayx"
# Like `rayx_core`.
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "rayx"
version_group = "rayx"
# The umbrella crate, like `rayx_core`.
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "rayx_app_macros"
version_group = "rayx"
# Like `rayx_core`.
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "rayx-cli"
version_group = "rayx"
# The `rayx` command-line tool, like `rayx_core`; dist builds and publishes its binaries for the
# tag.
git_tag_enable = false
git_release_enable = false
changelog_update = false

[changelog]
header = """# Changelog

All notable changes to `rayx`, `rayx_app`, `rayx_core`, `rayx_runtime`, `rayx_app_macros` and
`rayx-cli` (the `rayx` command-line tool) are documented in this file. They share one version and
one release tag `vX.Y.Z`. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the crates follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). It is generated from
Conventional Commits by release-plz.

"""
# Each `Migration:` footer of a commit is printed as a nested line under its entry. The
# `## [X.Y.Z] - YYYY-MM-DD` heading is the form dist's changelog parser reads for the release notes.
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
{%- if commit.scope -%}
- *({{ commit.scope }})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endif -%}
{% for footer in commit.footers -%}
{% if footer.token == "Migration" %}{{ "  " }}- Migration: {{ footer.value }}
{% endif -%}
{% endfor -%}
{% endfor -%}
{% endfor %}
"""
trim = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  # Housekeeping that is not a change to the crates.
  { message = "^chore\\(agentx\\)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^(ci|build)", group = "Build and CI" },
  { message = "^test", group = "Tests" },
  { message = "^chore", group = "Maintenance" },
]
