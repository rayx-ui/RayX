name: Release-plz

# Releases the three crates under one version (see docs/releasing.md). It runs no tests: `ci.yml`
# tests pull requests (the release pull request included) and pushes to `main`.
#
# `release` tags `vX.Y.Z` when the version in Cargo.toml has no tag yet (the merged release pull
# request) and creates the GitHub Release with that version's CHANGELOG.md section as notes;
# release-plz itself creates the Release, there is no cargo-dist here. `v0.4.0` was tagged by hand,
# so the first run finds it and releases nothing. `release-pr` then keeps the next release pull
# request up to date. It waits for `release`, so the release pull request is always computed after
# the newest tag exists.
#
# RELEASE_PLZ_TOKEN is a fine-grained personal access token (see docs/releasing.md). Events made with
# the default GITHUB_TOKEN start no workflows, so with it the release pull request would get no CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: release
    if: github.repository == 'rayx-ui/RayX'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-pr:
    name: release-pr
    needs: release
    if: github.repository == 'rayx-ui/RayX'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
