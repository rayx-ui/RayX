name: RayX

# Formatting, Clippy and the tests for the whole workspace, and the wasm32 build of the NSH-free
# crates (the core, with every service's contract, and the dev tools' protocol), on Ubuntu; and the `rayx` command-line tool (`rayx-cli`),
# which runs on every desktop, on Linux, macOS and Windows. Runs on every pull request
# (release-plz's release pull requests included). `main` runs every three hours, and only when it
# moved since the last scheduled run, instead of on every push: one run covers every push since the
# last one, and it saves the dependencies' caches pull requests restore. The toolchain is
# rust-toolchain.toml's.
on:
  pull_request:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Scheduled runs: only when main moved since the last one.
  changed:
    if: github.event_name == 'schedule'
    permissions:
      actions: read
    uses: ./.github/workflows/changed.yml

  rust:
    name: fmt, clippy, test, wasm32
    needs: changed
    # A skipped `changed` (every event but the schedule) lets the checks run.
    if: ${{ !cancelled() && needs.changed.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    # Every test binary links NSH, oxc and QuickJS; without debug info they fit the runner's disk.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      # The workspace's test binaries outgrow the runner's free disk: drop the preinstalled
      # toolchains RayX never uses (.NET, Android, GHC, CodeQL).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      # QuickJS, the JavaScript engine of the NSH layer's tests, is C; bindgen needs libclang.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      # Dependencies only (NSH, oxc, QuickJS): main's runs save it, pull requests restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The umbrella's groups that need service features beyond the defaults declare
      # `required-features` (`service_replacement`, `ts_service_contracts`, …), which the
      # workspace run skips: they run, and are linted, with every feature on.
      - run: cargo clippy -p rayx --all-features --all-targets -- -D warnings
      - run: cargo test -p rayx --all-features
      - run: cargo check -p rayx_app -p rayx_devtools_protocol --target wasm32-unknown-unknown

  cli:
    name: rayx-cli on ${{ matrix.os }}
    needs: changed
    if: ${{ !cancelled() && needs.changed.outputs.run != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      # rayx-cli's own dependencies; it builds none of NSH.
      - uses: Swatinem/rust-cache@v2
        with:
          key: rayx-cli
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt -p rayx-cli --check
      - run: cargo clippy -p rayx-cli --all-targets -- -D warnings
      # The real proofs (the `proof_*` groups) are `#[ignore]`d: they install nsh and run apps,
      # and run on demand with `cargo test -p rayx-cli --test proof_<name> -- --ignored`.
      - run: cargo test -p rayx-cli
