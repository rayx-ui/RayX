[workspace]
resolver = "3"
members = [
    "crates/rayx",
    "crates/rayx_app",
    "crates/rayx_core",
    "crates/rayx_runtime",
    "crates/rayx_app_macros",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
repository = "https://github.com/rayx-ui/RayX"

[workspace.dependencies]
rayx_core = { path = "crates/rayx_core" }
rayx_runtime = { path = "crates/rayx_runtime" }
rayx_app = { path = "crates/rayx_app" }
rayx_app_macros = { path = "crates/rayx_app_macros" }
nsh-core = "0.3.0"
nsh-base = "0.3.0"
nsh-engine = { version = "0.3.0", default-features = false }
nsh-bundler = "0.3.0"
nsh-js = "0.3.0"
crossbeam-channel = "0.5"
dxn_reactive = { git = "https://github.com/dXnSix/dXn.Reactive", tag = "v1.1.0" }
dxn_i18n = { git = "https://github.com/dXnSix/dXn.I18n", tag = "v0.1.0" }
dxn_intl = { git = "https://github.com/dXnSix/dXn.Intl", tag = "v0.1.0" }
futures = { version = "0.3.31", default-features = false }
proc-macro-crate = "3.4"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", default-features = false, features = ["std"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"

# NSH comes from an integration tag of the fork (github.com/dXnSix/nsh,
# `fork-*`); a consumer's own patch decides there.
[patch.crates-io]
nsh-macros = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.3.0-1" }
nsh-core = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.3.0-1" }
nsh-base = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.3.0-1" }
nsh-package = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.3.0-1" }
nsh-js = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.3.0-1" }
nsh-engine = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.3.0-1" }
nsh-bundler = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.3.0-1" }
