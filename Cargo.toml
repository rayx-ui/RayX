[workspace]
resolver = "3"
members = [
    "crates/rayx",
    "crates/rayx_app_nsh",
    "crates/rayx_app",
    "crates/rayx_services_application_configuration",
    "crates/rayx_services_assets",
    "crates/rayx_services_fonts",
    "crates/rayx_services_history",
    "crates/rayx_services_i18n",
    "crates/rayx_services_input_map",
    "crates/rayx_services_navigation",
    "crates/rayx_services_operations",
    "crates/rayx_services_platform",
    "crates/rayx_services_selection",
    "crates/rayx_services_storage",
    "crates/rayx_services_suspension",
    "crates/rayx_app_macros",
    "crates/rayx_cli",
    "crates/rayx_components",
    "crates/rayx_devtools_protocol",
    "examples/gallery/native",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/rayx-ui/RayX"

[workspace.dependencies]
rayx = { path = "crates/rayx" }
rayx_app = { path = "crates/rayx_app" }
rayx_app_nsh = { path = "crates/rayx_app_nsh" }
rayx_app_macros = { path = "crates/rayx_app_macros" }
rayx_components = { path = "crates/rayx_components" }
rayx_devtools_protocol = { path = "crates/rayx_devtools_protocol" }
rayx_services_application_configuration = { path = "crates/rayx_services_application_configuration" }
rayx_services_assets = { path = "crates/rayx_services_assets" }
rayx_services_fonts = { path = "crates/rayx_services_fonts" }
rayx_services_history = { path = "crates/rayx_services_history" }
rayx_services_i18n = { path = "crates/rayx_services_i18n" }
rayx_services_input_map = { path = "crates/rayx_services_input_map" }
rayx_services_navigation = { path = "crates/rayx_services_navigation" }
rayx_services_operations = { path = "crates/rayx_services_operations" }
rayx_services_platform = { path = "crates/rayx_services_platform" }
rayx_services_selection = { path = "crates/rayx_services_selection" }
rayx_services_storage = { path = "crates/rayx_services_storage" }
rayx_services_suspension = { path = "crates/rayx_services_suspension" }
nsh-core = "0.5.0"
nsh-base = "0.5.0"
nsh-engine = { version = "0.5.0", default-features = false }
nsh-bundler = "0.5.0"
nsh-js = "0.5.0"
base64 = "0.22"
crossbeam-channel = "0.5"
dxn_reactive = { git = "https://github.com/dXnSix/dXn.Reactive", tag = "v1.1.0" }
dxn_i18n = { git = "https://github.com/dXnSix/dXn.I18n", tag = "v0.1.2" }
dxn_i18n_macros = { git = "https://github.com/dXnSix/dXn.I18n", tag = "v0.1.2" }
dxn_intl = { git = "https://github.com/dXnSix/dXn.Intl", tag = "v0.1.2" }
futures = { version = "0.3.31", default-features = false }
getrandom = { version = "0.4", default-features = false }
proc-macro-crate = "3.4"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", default-features = false, features = ["std"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
url = "2.5"

# Dev and test builds keep file and line numbers for RayX's own crates (panics and backtraces)
# and no debug info for dependencies. Full debug info gave every test binary that links NSH,
# oxc and QuickJS a debug-symbol file of up to 1.2 GB, doubled link times and ran parallel
# builds out of memory. For a debugger session, build with `--config profile.dev.debug=true`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The profile dist builds the `rayx` binaries with (dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"

# NSH comes from an integration tag of the fork (github.com/dXnSix/nsh,
# `nshx-*`); a consumer's own patch decides there.
[patch.crates-io]
nsh-macros = { git = "https://github.com/dXnSix/nsh", tag = "nshx-0.5.0-7" }
nsh-core = { git = "https://github.com/dXnSix/nsh", tag = "nshx-0.5.0-7" }
nsh-base = { git = "https://github.com/dXnSix/nsh", tag = "nshx-0.5.0-7" }
nsh-package = { git = "https://github.com/dXnSix/nsh", tag = "nshx-0.5.0-7" }
nsh-js = { git = "https://github.com/dXnSix/nsh", tag = "nshx-0.5.0-7" }
nsh-engine = { git = "https://github.com/dXnSix/nsh", tag = "nshx-0.5.0-7" }
nsh-bundler = { git = "https://github.com/dXnSix/nsh", tag = "nshx-0.5.0-7" }
