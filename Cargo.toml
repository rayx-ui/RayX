[workspace]
resolver = "3"
members = ["crates/rayx_app", "crates/rayx_core", "crates/rayx_app_macros"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
repository = "https://github.com/rayx-ui/RayX"

[workspace.dependencies]
rayx_core = { path = "crates/rayx_core" }
rayx_app_macros = { path = "crates/rayx_app_macros" }
nsh-core = "0.2.0"
nsh-base = "0.2.0"
nsh-engine = { version = "0.2.0", default-features = false }
nsh-bundler = "0.2.0"
nsh-js = "0.2.0"
crossbeam-channel = "0.5"
dxn_reactive = { git = "https://github.com/dXnSix/dXn.Reactive", tag = "v1.1.0" }
futures = { version = "0.3.31", default-features = false }
proc-macro-crate = "3.4"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", default-features = false, features = ["std"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"

# NSH comes from an integration tag of the fork (github.com/dXnSix/nsh,
# `fork-*`); a consumer's own patch decides there.
[patch.crates-io]
nsh-macros = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.2.0-10" }
nsh-core = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.2.0-10" }
nsh-base = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.2.0-10" }
nsh-package = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.2.0-10" }
nsh-js = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.2.0-10" }
nsh-engine = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.2.0-10" }
nsh-bundler = { git = "https://github.com/dXnSix/nsh", tag = "fork-0.2.0-10" }
