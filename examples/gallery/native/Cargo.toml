[package]
name = "rayx-gallery"
description = "The RayX gallery's crate: RayX's UI set (its TS classes and component library) for the gallery's TSX screens (rayx-gallery/native), and the glyphs its examples draw."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nsh-core.workspace = true
# The services the gallery starts RayX with (`App.tsx`): the four the host requires, and the theme
# service its toolbar picks the color mode and the modifiers' contexts through.
rayx = { workspace = true, features = ["platform", "suspension", "assets", "fonts", "theme"] }

[dev-dependencies]
nsh-core = { workspace = true, features = ["declarations"] }
nsh-base.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
nsh-bundler.workspace = true
nsh-js.workspace = true
crossbeam-channel.workspace = true
nsh-theme.workspace = true
serde_json.workspace = true
