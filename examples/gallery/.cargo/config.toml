# The NSH this app is built with: rayx's default pin when the app was created
# (nshx-0.5.0-1 at 8314332). Cargo.lock records its commit, which is the app's nsh pin;
# move every line together to change it. It patches RayX's NSH crates and those of
# the hosts and runners nsh generates for the app, which a build that does not use
# them names in a warning.

[patch.crates-io]
nsh-base = { git = "https://github.com/dXnSix/nsh", tag = "nshx-0.5.0-1" }
nsh-bundler = { git = "https://github.com/dXnSix/nsh", tag = "nshx-0.5.0-1" }
